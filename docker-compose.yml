services:
  burial:
    build: .
    container_name: burial
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /burial/data/burial.db
    healthcheck:
      test: ["CMD", "python", "main.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/burial/data
      - ./logs:/burial/logs
